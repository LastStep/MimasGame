# nginx bootstrap site for Mimas — port 80 only, and only long enough to get a certificate.
#
# certbot's nginx authenticator needs a server block that already answers for
# mimas.laststep.cloud before it can solve the HTTP-01 challenge. The real block
# (nginx-mimas.conf) cannot be installed first, because it references certificate files that do not
# exist yet and would fail `nginx -t`. So vps-setup.sh installs this one, gets the certificate, and
# then overwrites it with the real block.
#
# It serves nothing: the game is not deployed at this point, and 404 is the honest answer.

server {
    listen 80;
    listen [::]:80;
    server_name mimas.laststep.cloud;
    root /home/mimas/servers/mimas.laststep.cloud/web;
    location / { return 404; }
}
