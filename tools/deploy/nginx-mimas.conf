# nginx site for Mimas — https://mimas.laststep.cloud
#
# Unity Web build (Brotli, decompression fallback OFF) served as static files, plus a WebSocket
# reverse proxy to Mimas.Server on the loopback interface. Based on Unity's official 6000.4 nginx
# sample: https://docs.unity3d.com/6000.4/Documentation/Manual/web-server-config-nginx.html
#
# WHO INSTALLS THIS: `tools/deploy/vps-setup.sh`, to /etc/nginx/sites-available/mimas.laststep.cloud
# with a symlink into sites-enabled. Editing it here and re-running `deploy.sh --setup` is how it
# changes on the VPS; never hand-edit the copy on the server, it will be overwritten.
#
# CERTBOT NEVER EDITS THIS FILE. The certificate is issued with `certbot certonly --nginx` (ADR-031,
# decision D8), so certbot writes no "managed by Certbot" lines here and the paths below are ours.
#
# THE VPS IS SHARED. /etc/nginx/sites-enabled/laststep.cloud belongs to another product on the same
# box (laststep.cloud, www, api, panel, mc, one certbot cert). It is not ours and is never opened,
# never edited, and never included from here. Mimas's entire nginx footprint is this one file.
#
# nginx on the box is 1.24.0: `listen 443 ssl http2;` is the right syntax here. `http2 on;` is 1.25+
# and will fail `nginx -t`.

# The WebSocket upgrade map. The target variable is deliberately named $mimas_connection_upgrade
# rather than the conventional $connection_upgrade: sites-enabled/* are all included into the same
# http block, and two files declaring a map for the same variable is a duplicate-map error that
# would take the other site down with us.
map $http_upgrade $mimas_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream mimas_ws {
    server 127.0.0.1:7777;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mimas.laststep.cloud;

    ssl_certificate     /etc/letsencrypt/live/mimas.laststep.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mimas.laststep.cloud/privkey.pem;
    # Both files are placed by certbot and are already used by the other site on this box.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/mimas/servers/mimas.laststep.cloud/web;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;   # nothing is ever uploaded to this host; the socket carries JSON

    # Dynamic gzip only for small text; never for Unity's pre-compressed files
    gzip on;
    gzip_types text/css application/json text/plain image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache, no-transform";
    }

    # The template's stylesheet, favicon and logos. Not hashed, so they cannot be immutable, but they
    # change about once a milestone — an hour is a fair trade against a stale-looking page.
    location /TemplateData/ {
        add_header Cache-Control "public, max-age=3600, no-transform";
    }

    location /Build/ {
        # Long cache is safe only with "Name Files As Hashes" enabled in Player Settings
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform";

        # ---- Brotli-precompressed ----
        # NOTE: add_header inside a nested location REPLACES every header inherited from the parent,
        # it does not add to them. That is why Cache-Control is repeated in each of these blocks
        # instead of being set once above.
        location ~ .+\.(data|symbols\.json)\.br$ {
            gzip off;                    # never re-compress an already-compressed body
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
            default_type application/octet-stream;
        }
        location ~ .+\.js\.br$ {
            gzip off;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
            default_type application/javascript;
        }
        location ~ .+\.wasm\.br$ {
            gzip off;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
            default_type application/wasm;   # required for WebAssembly.instantiateStreaming
        }

        # There are deliberately no .gz locations. WebBuild.cs builds with compression=Brotli and
        # decompression fallback off (docs/hosting.md, "Unity build settings that hosting depends
        # on"), so no .gz file is ever produced and a location for one could only ever match a stale
        # leftover. If the build format changes, this block and that table change together.
    }

    # Only if "Enable Native C/C++ Multithreading" is ON (SharedArrayBuffer needs cross-origin isolation)
    # location ~ .+\.(htm|html|js|js\.gz|js\.br)$ {
    #     add_header Cross-Origin-Opener-Policy same-origin;
    #     add_header Cross-Origin-Embedder-Policy require-corp;
    #     add_header Cross-Origin-Resource-Policy cross-origin;
    # }

    # ---- WebSocket game server ----
    location /ws {
        proxy_pass http://mimas_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mimas_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;    # a turn-based match can sit quiet for a long time
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # Exact match: /health and nothing under it. The runbook reads `rooms` from this before deploying.
    location = /health {
        proxy_pass http://mimas_ws/health;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mimas.laststep.cloud;
    return 301 https://$host$request_uri;
}
