# nginx config for Mimas — Unity Web build (Brotli, no decompression fallback) + WebSocket game server
# Based on Unity's official 6000.4 nginx sample: https://docs.unity3d.com/6000.4/Documentation/Manual/web-server-config-nginx.html

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream mimas_ws {
    server 127.0.0.1:7777;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mimas.example.com;   # TODO: your domain

    ssl_certificate     /etc/letsencrypt/live/mimas.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mimas.example.com/privkey.pem;

    root /var/www/mimas;
    index index.html;

    # Dynamic gzip only for small text; never for Unity's pre-compressed files
    gzip on;
    gzip_types text/css application/json text/plain image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache, no-transform";
    }

    location /Build/ {
        # Long cache is safe only with "Name Files As Hashes" enabled in Player Settings
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform";

        # ---- Brotli-precompressed ----
        location ~ .+\.(data|symbols\.json)\.br$ {
            gzip off;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
            default_type application/octet-stream;
        }
        location ~ .+\.js\.br$ {
            gzip off;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
            default_type application/javascript;
        }
        location ~ .+\.wasm\.br$ {
            gzip off;
            add_header Content-Encoding br;
            add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
            default_type application/wasm;   # required for WebAssembly.instantiateStreaming
        }

        # ---- gzip-precompressed (only if the build uses Gzip) ----
        location ~ .+\.(data|symbols\.json)\.gz$ {
            gzip off;
            add_header Content-Encoding gzip;
            default_type application/gzip;
        }
        location ~ .+\.js\.gz$ {
            gzip off;
            add_header Content-Encoding gzip;
            default_type application/javascript;
        }
        location ~ .+\.wasm\.gz$ {
            gzip off;
            add_header Content-Encoding gzip;
            default_type application/wasm;
        }
    }

    # Only if "Enable Native C/C++ Multithreading" is ON (SharedArrayBuffer needs cross-origin isolation)
    # location ~ .+\.(htm|html|js|js\.gz|js\.br)$ {
    #     add_header Cross-Origin-Opener-Policy same-origin;
    #     add_header Cross-Origin-Embedder-Policy require-corp;
    #     add_header Cross-Origin-Resource-Policy cross-origin;
    # }

    # ---- WebSocket game server ----
    location /ws {
        proxy_pass http://mimas_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://mimas_ws/health;
    }
}

server {
    listen 80;
    server_name mimas.example.com;
    return 301 https://$host$request_uri;
}
